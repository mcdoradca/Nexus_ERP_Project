version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      # ... Oraz wszystkie inne klucze API (Gemini, BaseLinker, Claid) ...
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      # Mapujemy folder ze statycznymi uploadami (jeśli chcemy zachować pliki między restartami)
      - nexus_uploads:/app/frontend/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_etc:/etc/letsencrypt

volumes:
  nexus_uploads:
  certbot_etc:
