version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexusadmin123}
      POSTGRES_DB: ${DB_NAME:-nexusdb}
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-nexusadmin123}@db:5432/${DB_NAME:-nexusdb}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      # ... Oraz wszystkie inne klucze API (Gemini, BaseLinker, Claid) ...
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      # Mapujemy folder ze statycznymi uploadami (jeśli chcemy zachować pliki między restartami)
      - nexus_uploads:/app/frontend/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  nexus_pgdata:
  nexus_uploads:
