name: Deploy Nexus ERP to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Przerwij skrypt w przypadku jakiegokolwiek bledu
            set -e
            
            # 1. Przejdź do folderu aplikacji
            cd /var/www/nexus
            
            # 2. Pobierz najnowsze zmiany z GitHuba
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # 3. Zainstaluj zależności backendu i uruchom TESTY (CI)
            npm install
            npm test
            
            # 4. Budowa frontendu
            cd frontend
            npm install
            npm run build
            cd ..
            
            # 5. Aktualizacja bazy danych (z wbudowanym backupem uzywajac db:push-safe)
            npx prisma generate
            npm run db:push-safe
            
            # 6. Zrestartuj proces Node.js za pomocą PM2
            pm2 restart nexus
