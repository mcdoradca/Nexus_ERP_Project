name: Deploy Nexus ERP to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Przejdź do folderu aplikacji
            cd /var/www/nexus
            
            # 2. Pobierz najnowsze zmiany z GitHuba
            git fetch origin
            git reset --hard origin/main
            
            # 3. Zainstaluj zależności i zbuduj backend i frontend
            npm install
            
            # Budowa frontendu
            cd frontend
            npm install
            npm run build
            cd ..
            
            # 4. Aktualizacja bazy danych (Prisma)
            npx prisma generate
            
            # 5. Zrestartuj proces Node.js za pomocą PM2
            pm2 restart nexus
