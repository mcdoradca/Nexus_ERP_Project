name: Deploy Nexus ERP to OVH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy frontend dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "/var/www/nexus"

      - name: Deploy Backend and Restart via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Przerwij skrypt w przypadku jakiegokolwiek bledu
            set -e
            
            # 1. Przejdź do folderu aplikacji
            cd /var/www/nexus
            
            # Zabezpieczenie przed 'dubious ownership' i 'Permission denied' na serwerach linuksowych
            sudo chown -R $(whoami):$(whoami) /var/www/nexus
            git config --global --add safe.directory /var/www/nexus
            
            # 2. Pobierz najnowsze zmiany z GitHuba
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # 3. Zainstaluj zależności backendu i uruchom TESTY (CI)
            npm install
            npm test
            
            # 4. Aktualizacja bazy danych (z wbudowanym backupem uzywajac db:push-safe)
            npx prisma generate
            npm run db:push-safe
            
            # 5. Aktualizacja i przeładowanie konfiguracji Nginx dla proxy i 600s timeoutu
            if [ -f "frontend/nginx-https.tpl" ]; then
                sudo cp frontend/nginx-https.tpl /etc/nginx/sites-available/nexus 2>/dev/null || true
                sudo ln -sf /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/nexus 2>/dev/null || true
                sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
                sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true
            fi

            # 6. Zrestartuj proces Node.js za pomocą PM2
            pm2 restart nexus
