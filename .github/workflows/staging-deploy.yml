name: Deploy Nexus ERP to Staging (OVH)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy frontend dist via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "/var/www/nexus-staging"

      - name: Deploy Backend and Restart via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Przerwij skrypt w przypadku jakiegokolwiek bledu
            set -e
            
            # 1. Przejdź do folderu instancji Staging
            cd /var/www/nexus-staging
            
            # 2. Pobierz najnowsze zmiany z gałęzi dev
            git fetch origin
            git reset --hard origin/dev
            git clean -fd
            
            # 3. Zainstaluj zależności backendu i uruchom TESTY (CI)
            npm install
            npm test
            
            # 4. Aktualizacja bazy danych (z wbudowanym backupem)
            npx prisma generate
            npm run db:push-safe
            
            # 5. Zrestartuj testowy proces Node.js
            pm2 restart nexus-staging
